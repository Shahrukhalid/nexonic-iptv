[project]
name = "nexonic-iptv"
version = "1.1.0"
description = "Curated, verified, family-friendly free live TV playlists organised by country."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S105", "S311", "S603", "S607", "E501", "B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["E402", "I001"]
