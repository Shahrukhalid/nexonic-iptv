name: Generate playlists
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "nexonic/**"
      - "scripts/generate.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-writer
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository_owner == 'Shahrukhalid'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Moderation gate
        run: python scripts/moderate.py
      - name: Generate
        run: python scripts/generate.py
      - name: Validate output
        run: python scripts/validate.py
      - name: Commit only if outputs changed (signed via API)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_BRANCH: main
        run: python scripts/commit_via_api.py --message "Regenerate playlists" reports playlists PLAYLISTS.md README.md
