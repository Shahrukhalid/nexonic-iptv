name: Apps
# Builds, tests and packages the Nexonic IPTV player for Windows (.exe installer), macOS (.dmg, Apple Silicon and
# Intel) and Android (.apk) from the Flutter code in app/. The platform folders are generated by `flutter create` and
# branded by app/tool/prepare_platforms.py. Each build is installed and started, and a self-test in the release build
# downloads the live catalogue and plays verified channels. App release.yml calls this workflow before publishing.
on:
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml", ".github/workflows/app-release.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: App version
        type: string
        required: true

permissions:
  contents: read

env:
  APP_VERSION: ${{ inputs.version || '1.3.0' }}

jobs:
  test:
    name: Analyze and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Flutter
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: App icon from the website logo
        run: |
          sudo apt-get install -y -qq librsvg2-bin >/dev/null
          mkdir -p app/assets
          rsvg-convert -w 1024 -h 1024 website/public/favicon.svg -o app/assets/icon.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: icon
          path: app/assets/icon.png
      - name: Analyze and test
        working-directory: app
        run: |
          flutter --version
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: icon
          path: app/assets
      - name: Flutter
        working-directory: .
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          flutter create --platforms=windows --project-name nexonic_iptv --org com.nexonic .
          python tool/prepare_platforms.py windows
          flutter pub get
          dart run flutter_launcher_icons
          flutter build windows --release --build-name "$APP_VERSION" --build-number "$GITHUB_RUN_NUMBER"
          rel=build/windows/x64/runner/Release
          test -f "$rel/NexonicIPTV.exe"
          # The Visual C++ runtime, so the app starts on PCs that do not have it.
          for f in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do cp "/c/Windows/System32/$f" "$rel/"; done
          cp ../LICENSE "$rel/LICENSE.txt"
          cp ../NOTICE.md "$rel/NOTICE.md"
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $rel = (Resolve-Path build\windows\x64\runner\Release).Path
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$rel" "/DOutDir=$env:RUNNER_TEMP\out" `
            "/DLicenseFile=$((Resolve-Path ..\LICENSE).Path)" "/DIconFile=$((Resolve-Path windows\runner\resources\app_icon.ico).Path)" `
            packaging\nexonic.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install, start and self-test
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\installed"
          $p = Start-Process "$env:RUNNER_TEMP\out\NexonicIPTV-Windows-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$dir" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $exe = "$dir\NexonicIPTV.exe"
          if (-not (Test-Path $exe)) { throw "not installed" }
          # 1. Normal start: the window must stay up.
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "the app closed by itself (exit code $($app.ExitCode))" }
          Stop-Process -Id $app.Id -Force
          # 2. Self-test: live catalogue, offline cache and real playback.
          $out = "$env:RUNNER_TEMP\selftest.json"
          $env:NEXONIC_SELF_TEST = $out
          $t = Start-Process $exe -PassThru
          if (-not $t.WaitForExit(600000)) { Stop-Process -Id $t.Id -Force; throw "self-test timed out" }
          Get-Content $out
          $r = Get-Content $out | ConvertFrom-Json
          if (-not $r.ok) { throw "self-test failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-windows
          path: ${{ runner.temp }}/out/NexonicIPTV-Windows-Setup.exe
          if-no-files-found: error

  macos:
    name: macOS disk image
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: icon
          path: app/assets
      - name: Flutter
        working-directory: .
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          flutter create --platforms=macos --project-name nexonic_iptv --org com.nexonic .
          python3 tool/prepare_platforms.py macos
          flutter pub get
          dart run flutter_launcher_icons
          flutter build macos --release --build-name "$APP_VERSION" --build-number "$GITHUB_RUN_NUMBER"
          app="build/macos/Build/Products/Release/Nexonic IPTV.app"
          archs=$(lipo -archs "$app/Contents/MacOS/Nexonic IPTV")
          echo "architectures: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "::error::not a universal app"; exit 1; }
          codesign --verify --deep "$app"
      - name: Disk image
        run: |
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          cp -R "build/macos/Build/Products/Release/Nexonic IPTV.app" "$stage/"
          ln -s /Applications "$stage/Applications"
          cp ../LICENSE "$stage/LICENSE.txt"
          hdiutil create -volname "Nexonic IPTV" -srcfolder "$stage" -ov -format UDZO "$RUNNER_TEMP/NexonicIPTV-macOS.dmg"
      - name: Install, start and self-test
        run: |
          mnt=$(hdiutil attach -nobrowse "$RUNNER_TEMP/NexonicIPTV-macOS.dmg" | tail -1 | cut -f3-)
          cp -R "$mnt/Nexonic IPTV.app" "$RUNNER_TEMP/"
          hdiutil detach "$mnt"
          bin="$RUNNER_TEMP/Nexonic IPTV.app/Contents/MacOS/Nexonic IPTV"
          "$bin" & pid=$!
          sleep 20
          kill -0 "$pid" || { echo "::error::the app closed by itself"; exit 1; }
          kill "$pid"
          log="$RUNNER_TEMP/selftest.log"
          NEXONIC_SELF_TEST=log "$bin" > "$log" 2>&1 &
          tpid=$!
          for _ in $(seq 1 120); do kill -0 "$tpid" 2>/dev/null || break; sleep 5; done
          kill -0 "$tpid" 2>/dev/null && { kill "$tpid"; echo "::error::self-test timed out"; exit 1; }
          result=$(grep -o 'NEXONIC_SELF_TEST .*' "$log" | tail -1)
          echo "$result"
          echo "${result#NEXONIC_SELF_TEST }" | python3 -c "import json,sys; sys.exit(0 if json.load(sys.stdin)['ok'] else 1)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-macos
          path: ${{ runner.temp }}/NexonicIPTV-macOS.dmg
          if-no-files-found: error

  android:
    name: Android app
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: icon
          path: app/assets
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Flutter
        working-directory: .
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          flutter create --platforms=android --project-name nexonic_iptv --org com.nexonic .
          python3 tool/prepare_platforms.py android
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --dart-define=NEXONIC_SELF_TEST=log --build-name "$APP_VERSION" --build-number "$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/selftest.apk"
          flutter build apk --release --build-name "$APP_VERSION" --build-number "$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/NexonicIPTV-Android.apk"
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, start and self-test on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash app/tool/android_check.sh "$RUNNER_TEMP/selftest.apk" "$RUNNER_TEMP/NexonicIPTV-Android.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-android
          path: ${{ runner.temp }}/NexonicIPTV-Android.apk
          if-no-files-found: error
