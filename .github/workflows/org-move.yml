name: Move links to Nexonic Technologies
on:
  push:
    branches: [org-move]
    paths: ['.github/workflows/org-move.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: org-move
jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Point links and code at the organization
        run: |
          cat > /tmp/orgmove.py <<'PY'
          #!/usr/bin/env python3
          """One-time move of links from the personal account (Shahrukhalid) to the nexonic-technologies organization."""
          import os, re, sys

          ORG = "nexonic-technologies"
          REPOS = r"nexonic-download-manager|nexonic-iptv|nexonic-tv-server|scruvix|nexonic-sentinel"
          SITE = {
              "nexonic-download-manager": "https://nexonictechnologies.com/project/ndm/",
              "nexonic-tv-server": "https://nexonictechnologies.com/project/nts/",
              "nexonic-sentinel": "https://nexonictechnologies.com/project/nexonic-sentinel/",
              "scruvix": "https://nexonictechnologies.com/project/scruvix/",
          }
          RAWDIR = {"nexonic-download-manager": "site", "nexonic-tv-server": "docs", "nexonic-sentinel": "docs", "scruvix": "docs"}
          SKIP_DIRS = {".git", "node_modules", ".venv"}

          def pages(m):
              repo, path = m.group(2).lower(), m.group(3) or ""
              if repo == "nexonic-iptv":  # IPTV keeps its data site (playlists + Xtream files) on GitHub Pages
                  return f"https://{ORG}.github.io/nexonic-iptv{path}"
              bare = re.split(r"[?#]", path)[0]
              last = bare.rstrip("/").rsplit("/", 1)[-1] if bare.strip("/") else ""
              if "." in last and not last.endswith((".html", ".htm")):
                  return f"https://raw.githubusercontent.com/{ORG}/{repo}/main/{RAWDIR[repo]}{bare}"
              return SITE[repo]

          RULES = [
              (re.compile(r"(https?://)?shahrukhalid\.github\.io/(" + REPOS + r")((?:/[^\s\"'<>)\]`|,;]*)?)", re.I), pages),
              (re.compile(r"\bShahrukhalid/(" + REPOS + r")\b", re.I), lambda m: f"{ORG}/{m.group(1)}"),
              (re.compile(r"\|Shahrukhalid\|(" + REPOS + r")\|", re.I), lambda m: f"|{ORG}|{m.group(1)}|"),
              (re.compile(r"brew tap shahrukhalid/nexonic\b", re.I), lambda m: f"brew tap {ORG}/nexonic"),
              (re.compile(r"github\.com/Shahrukhalid(?![/\w.-])"), lambda m: f"github.com/{ORG}"),
              (re.compile(r"%nwww\.shahrukhalid\.com"), lambda m: "%nnexonictechnologies.com"),
              (re.compile(r"sk@shahrukhalid\.com", re.I), lambda m: "info@nexonictechnologies.com"),
              (re.compile(r"(https?://)?shahrukhalid\.github\.io(?=[\"'\s`]|$)", re.I), lambda m: f"https://{ORG}.github.io"),
          ]
          SITE_RE = re.compile(r"(?<![@\w.-])(https?://)?(www\.)?shahrukhalid\.com/?(?![\w/])")

          def fix(text):
              for rx, fn in RULES:
                  text = rx.sub(fn, text)
              # Company website instead of the personal one, except personal credit lines that name Shahrukh Khalid.
              out = []
              for line in text.split("\n"):
                  if "Shahrukh Khalid" not in line:
                      line = SITE_RE.sub(lambda m: ("https://" if m.group(1) else "") + "nexonictechnologies.com", line)
                  out.append(line)
              return "\n".join(out)

          def main(root, include_workflows=False):
              changed = 0
              for d, dirs, files in os.walk(root):
                  dirs[:] = [x for x in dirs if x not in SKIP_DIRS]
                  rel = os.path.relpath(d, root)
                  if not include_workflows and rel.replace("\\", "/").startswith(".github/workflows"):
                      continue
                  for f in files:
                      p = os.path.join(d, f)
                      if f == "orgmove.py": continue
                      try:
                          with open(p, "rb") as fh: raw = fh.read()
                          if b"\0" in raw[:4096]: continue
                          s = raw.decode("utf-8")
                      except Exception:
                          continue
                      n = fix(s)
                      if n != s:
                          with open(p, "w", encoding="utf-8", newline="") as fh: fh.write(n)
                          changed += 1
              print("files changed:", changed)

          if __name__ == "__main__":
              main(sys.argv[1] if len(sys.argv) > 1 else ".", "--workflows" in sys.argv)

          PY
          python3 /tmp/orgmove.py .
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing to change"; exit 0; }
          git commit -qm "Move links and code to the nexonic-technologies organization"
          git push origin HEAD:org-move
