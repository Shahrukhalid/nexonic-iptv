name: Verify streams
on:
  schedule:
    - cron: "17 3,11,19 * * *" # three times a day: new streams are checked sooner and the backlog clears faster
  workflow_dispatch:
    inputs:
      ffprobe:
        description: "Also probe with FFprobe"
        type: boolean
        default: true
  workflow_run:
    # Verify right after the monthly catalog refresh (commits made with GITHUB_TOKEN do not trigger push events).
    workflows: ["Refresh catalog"]
    types: [completed]
permissions:
  contents: write # commit genuine results back via the signed GitHub API
concurrency:
  group: data-writer
  cancel-in-progress: false
jobs:
  verify:
    # Runs only on trusted refs (schedule, manual, push to main) — never on pull requests from forks.
    if: >-
      github.repository_owner == 'Shahrukhalid' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Install FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Live verification (bounded, rate-limited)
        env:
          EVENT: ${{ github.event_name }}
          FFPROBE: ${{ inputs.ffprobe }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FFPROBE" = "false" ]; then
            python scripts/verify.py
          else
            python scripts/verify.py --ffprobe
          fi
      - name: Regenerate playlists from the new results
        run: python scripts/generate.py
      - name: Validate before publishing
        run: python scripts/validate.py
      - name: Commit results (signed via API)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_BRANCH: main
        run: python scripts/commit_via_api.py --message "Update verification results and playlists" state reports playlists PLAYLISTS.md README.md
      - name: Summary
        run: cat reports/verification.md >> "$GITHUB_STEP_SUMMARY"
