name: Feature request
description: Suggest an improvement to playlists, the verifier or the website.
title: "Feature: <summary>"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem would this solve? }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: Proposed solution }
