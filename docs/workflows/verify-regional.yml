# Ready-to-paste workflow: copy this file to .github/workflows/verify-regional.yml (see docs/REGIONAL_CHECKS.md).
# It re-checks the channels that the GitHub-hosted runners could only mark as restricted, from a second location
# (a self-hosted runner you registered with the label nexonic-regional), and commits the results.
name: Verify streams (regional)
on:
  schedule:
    - cron: "47 4 * * *" # daily, 04:47 UTC (after the 03:17 run of "Verify streams")
  workflow_dispatch:
    inputs:
      label:
        description: "Location label (a-z, 0-9, dashes), for example asia-pk"
        type: string
        default: ${{ vars.REGIONAL_LABEL }}
# Never add pull_request or pull_request_target here: this job runs on your own machine.
permissions:
  contents: write # commit the results back via the signed GitHub API
concurrency:
  group: data-writer
  cancel-in-progress: false
jobs:
  verify-regional:
    if: github.repository_owner == 'Shahrukhalid'
    runs-on: [self-hosted, nexonic-regional]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Location label
        id: label
        env:
          INPUT_LABEL: ${{ inputs.label }}
          DEFAULT_LABEL: ${{ vars.REGIONAL_LABEL }}
        run: |
          label="${INPUT_LABEL:-$DEFAULT_LABEL}"
          if ! printf '%s' "$label" | grep -Eq '^[a-z0-9][a-z0-9-]{1,31}$'; then
            echo "Set the repository variable REGIONAL_LABEL (for example asia-pk) or pass the label input." >&2
            exit 1
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
      - name: Re-check restricted channels from this location (bounded, rate-limited)
        env:
          LABEL: ${{ steps.label.outputs.label }}
        run: python scripts/verify.py --location-label "$LABEL" --only GEO_RESTRICTED,UNKNOWN,TIMEOUT,restricted
      - name: Regenerate playlists and reports
        run: python scripts/generate.py
      - name: Validate before publishing
        run: python scripts/validate.py
      - name: Commit results (signed via API)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_BRANCH: main
          LABEL: ${{ steps.label.outputs.label }}
        run: python scripts/commit_via_api.py --message "Update regional verification results ($LABEL)" state reports playlists PLAYLISTS.md README.md
