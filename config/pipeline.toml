# Pipeline settings for the automation scripts. Every value shown is the built-in default; delete a line to fall
# back to it. Set NEXONIC_PIPELINE_CONFIG to point at a different file. See docs/AUTOMATION.md.

[verify]                      # scripts/verify.py (command-line flags override these)
timeout = 10.0                # seconds per request
concurrency = 12              # parallel channels (hard maximum is max_concurrency)
max_concurrency = 16
retries = 1                   # per request, timeouts / connection errors / 429 / 5xx only
backoff_base = 1.0            # seconds; doubles on each retry
per_host_interval = 1.0       # minimum seconds between requests to the same host
channel_timeout = 60.0        # hard cap per channel
budget_minutes = 40.0         # no new checks are started after this

[quarantine]                  # nexonic/lifecycle.py
consecutive_failures = 3      # N: consecutive failed checks ...
distinct_days = 2             # M: ... spread over at least this many distinct UTC days
intermittent_window_days = 7  # mixed working/failing results inside this window = "intermittent"

[guard]                       # scripts/validate.py publication guard
max_drop_percent = 10.0       # fail if the published channel count falls by more than this
max_added = 300               # fail if more than this many channels are added in one run
max_verified_drop_percent = 50.0
min_baseline = 50             # percentage rules are skipped when the previous count is below this
override = false              # true publishes anyway (or set NEXONIC_GUARD_OVERRIDE=1 for one run)

[changes]
history_days = 30             # daily summaries kept in state/change-history.json
max_listed = 200              # entries per list in reports/changes.json

[discovery]                   # scripts/expand_catalog.py and scripts/moderate.py --refresh-remote
timeout = 30.0
retries = 4
backoff_base = 2.0
max_archive_mb = 300
max_playlist_mb = 50          # size cap of each downloaded extra M3U file
allowed_hosts = ["github.com", "codeload.github.com", "raw.githubusercontent.com"]

[[discovery.sources]]
name = "iptv"
repo = "iptv-org/iptv"
ref = "master"

[[discovery.sources]]
name = "database"
repo = "iptv-org/database"
ref = "master"

# Third-party M3U lists published in public GitHub repositories. They are read exactly like `--extra-m3u` inputs: an
# entry is admitted only when its tvg-id matches iptv-org/database AND every automated admission rule of
# docs/SOURCE_POLICY.md section 2a holds (owner-domain match, URL policy, no special headers, exclusions, screening,
# a successful live check before publication). A playlist is only a pointer to candidates, never evidence.
# Only repositories with an open licence recorded here, plain M3U files, and no paid, premium, VOD, restream or
# credential-bearing content are listed. Order matters: for one channel the first source wins.
[[discovery.extra_m3u]]
name = "m3upt"
repo = "LITUATUI/M3UPT"
ref = "main"
paths = ["M3U/M3UPT.m3u"]
licence = "MIT"

[[discovery.extra_m3u]]
name = "iprtl"
repo = "iprtl/m3u"
ref = "live"
paths = ["Freetv.m3u"]
licence = "Unlicense"

[[discovery.extra_m3u]]
name = "iptv-com"
repo = "iptv-com/iptv"
ref = "main"
paths = ["lists/world.m3u", "lists/brazil.m3u"]
licence = "Unlicense"

[[discovery.extra_m3u]]
name = "openiptvitaly"
repo = "xN1ckuz/OpenIPTVItaly"
ref = "main"
paths = ["OpenIPTVItaly.m3u"]
licence = "MIT"

[[discovery.extra_m3u]]
name = "iptv-m3u-tr"
repo = "omerdenizhan/IPTV-M3U"
ref = "main"
paths = ["m3u/turkiye-iptv-org.m3u"]
licence = "Unlicense"

[[discovery.extra_m3u]]
name = "iptv-spain"
repo = "Ignac16/Iptv-spain-m3u-1416"
ref = "main"
paths = ["playlist_spain.m3u8"]
licence = "CC0-1.0"

[[discovery.extra_m3u]]
name = "ipmx"
repo = "Osares10/ipmx"
ref = "main"
paths = ["Mexico.m3u"]
licence = "Unlicense"

[[discovery.extra_m3u]]
name = "iptv-ecuador"
repo = "CL-Maker283/iptv-ecuador-tv"
ref = "main"
paths = ["streamings-ecuador-all.m3u"]
licence = "Unlicense"

# ---------------------------------------------------------------------------------------------------------------------
# Community live tier (nexonic/community.py, docs/TIERS.md). Separate playlists under playlists/community/; the catalogue
# lives in state/community/ because the daily workflow commits state/, reports/ and playlists/ only.
[community]
enabled = true
refresh_max_age_hours = 20.0      # the catalogue is rebuilt by the daily run when it is older than this
min_catalog_ratio = 0.5           # a rebuilt catalogue smaller than this share of the last good one is rejected
streams_per_channel = 1           # best-ranked streams kept per channel feed (max 5)
allow_restream_hosts = true       # known restream hosts may be listed and checked here (never with tokens)
# Rotating, budgeted validation: never-checked streams first, then the oldest-checked ones.
max_checks_per_run = 3000
run_budget_seconds = 1200.0       # no new community check is started after this
total_deadline_minutes = 44.0     # ... nor after this many minutes since scripts/verify.py started (workflow limit: 60)
concurrency = 32
max_concurrency = 64
timeout = 8.0                     # seconds per request
retries = 0
backoff_base = 1.0
per_host_interval = 1.0           # minimum seconds between requests to the same host
max_per_host_per_run = 40         # one CDN carrying hundreds of channels cannot use the whole budget
channel_timeout = 30.0
min_recheck_hours = 20.0          # a stream checked more recently than this is not due again
retry_failed_days = 3             # a stream whose last check failed waits this long ...
retry_quarantined_days = 14       # ... or this long when it is quarantined
history_per_stream = 8            # results kept per stream in state/community/history.json
# Lifecycle thresholds (nexonic/lifecycle.py) suited to one check every few days
quarantine_failures = 2
quarantine_distinct_days = 2
intermittent_window_days = 14
# Playlists
verified_days = 7                 # verified.m3u: the stream worked at its latest check within this many days
untested_in_dimension_playlists = true   # country/language/category/quality files also list untested streams, labelled

# ---------------------------------------------------------------------------------------------------------------------
# Free VOD tier (nexonic/vod.py, docs/TIERS.md): Internet Archive items that record public domain or an open CC licence.
[vod]
enabled = true
refresh_max_age_hours = 20.0
timeout = 30.0
retries = 3
backoff_base = 2.0
request_interval = 1.0            # seconds between requests to archive.org
rows_per_page = 200
search_pages_per_run = 4          # advanced-search pages read per daily run, across all collections
metadata_per_run = 150            # item metadata documents read per daily run (the daily slice)
run_budget_seconds = 300.0
total_deadline_minutes = 48.0     # no VOD request is made after this many minutes since verify.py started
max_items = 5000
rescan_days = 14                  # a finished collection search starts over after this many days
allow_weak_terms = false          # titles with words such as "love" or "night" go to manual review unless true
allowed_licences = ["publicdomain", "by", "by-sa", "by-nc", "by-nc-sa", "by-nd", "by-nc-nd"]
allowed_hosts = ["archive.org"]

# Collections searched. kind is "movie" or "series"; genre (optional) is a lower-case slug added to every item.
[[vod.collections]]
id = "feature_films"
kind = "movie"

[[vod.collections]]
id = "film_noir"
kind = "movie"
genre = "noir"

[[vod.collections]]
id = "SciFi_Horror"
kind = "movie"
genre = "scifi-horror"

[[vod.collections]]
id = "comedy_films"
kind = "movie"
genre = "comedy"

[[vod.collections]]
id = "classic_cartoons"
kind = "movie"
genre = "animation"

[[vod.collections]]
id = "classic_tv"
kind = "series"
